<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>現場モック集</title>
    <script>
      // SPA fallback for GitHub Pages project site /mock-gallery/
      // Build replaces dist/404.html with a copy of index.html.
      // This file remains the fallback if that copy is not present.
      (function (l) {
        var pathSegmentsToKeep = 1;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
